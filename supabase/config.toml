# Supabase local development config
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "studyly"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_insecure_test_accounts = true
double_confirm_changes = false

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false

[functions.upload-syllabus]
verify_jwt = true

[functions.generate-cards]
verify_jwt = true

[functions.nightly]
verify_jwt = false
